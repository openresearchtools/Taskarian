name: Taskarian Android browser
run-name: Taskarian ${{ inputs.source_sha }} / ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Taskarian source commit
        required: true
        type: string
      request_id:
        description: Request from the main workflow
        required: true
        type: string
      force_rebuild:
        description: Bypass native and APK artifact reuse
        default: false
        type: boolean
      auth_run:
        required: false
        type: string
      search_run:
        required: false
        type: string
      node_run:
        required: false
        type: string
      environments_run:
        required: false
        type: string
      office_run:
        required: false
        type: string
      engine_only:
        description: Build or validate the independent Gecko component without waiting for app dependencies
        default: false
        type: boolean
      native_key:
        description: Exact canonical Gecko input identity for the producer phase
        default: ''
        type: string
      require_native:
        description: Assemble resources only from an already published matching engine
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: ${{ inputs.engine_only && format('gecko-{0}', inputs.native_key) || format('resources-{0}-{1}', inputs.source_sha, inputs.request_id) }}
  cancel-in-progress: false
  queue: max
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MOZCONFIG: ${{ github.workspace }}/browser/taskarian/android/mozconfig
      MOZBUILD_STATE_PATH: ${{ github.workspace }}-mozbuild
      TASKARIAN_ANDROID_OBJDIR: ${{ github.workspace }}-obj-android
      ANDROID_NDK_HOME: ${{ github.workspace }}-mozbuild/android-ndk-r29
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      DISABLE_TELEMETRY: '1'
      RUSTUP_TOOLCHAIN: 1.96.0
      MACH_SHOW_PIP_OUTPUT: '1'
      SCCACHE_GHA_ENABLED: 'true'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GRADLE_FLAGS: --no-daemon --max-workers=2 --build-cache
      MOZ_SOURCE_REPO: https://github.com/openresearchtools/Taskarian
      MOZ_SOURCE_CHANGESET: ${{ inputs.source_sha }}
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_BASEDIRS: ${{ github.workspace }}:${{ github.workspace }}-obj-android
      SCCACHE_MULTILEVEL_CHAIN: disk,gha
      SCCACHE_DIR: ${{ github.workspace }}-gecko-sccache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openresearchtools/Taskarian
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /.github/builders/
          /agent/packaging/*.py
          /agent/packaging/node/lock.json
          /agent/vendor/native/android-sources.json
          /agent/src/server/platform/termux/updates-prepare.py
          /browser/taskarian/android/mozconfig
          /browser/taskarian/android/tor/
          /browser/taskarian/android/notices/
          /browser/taskarian/android/scripts/tor.py
          /browser/taskarian/third_party/tor.toml
          /browser/mobile/shared/modules/geckoview/TaskarianAndroid.sys.mjs
          /browser/mobile/android/installer/package-manifest.in
          /references/runtime-payload.json
          /browser/taskarian/config/
    - name: Select the Android architecture
      run: |
        case "$GITHUB_REPOSITORY" in
          openresearchtools/taskarian-build-android)
            echo 'BROWSER_TARGET=android' >> "$GITHUB_ENV"
            echo 'TASKARIAN_ANDROID_ABI=arm64-v8a' >> "$GITHUB_ENV"
            echo 'TASKARIAN_ANDROID_TARGET=aarch64-linux-android' >> "$GITHUB_ENV"
            echo 'TERMUX_ARCH=aarch64' >> "$GITHUB_ENV"
            ;;
          openresearchtools/taskarian-build-android-x86_64)
            echo 'BROWSER_TARGET=android-x86_64' >> "$GITHUB_ENV"
            echo 'TASKARIAN_ANDROID_ABI=x86_64' >> "$GITHUB_ENV"
            echo 'TASKARIAN_ANDROID_TARGET=x86_64-linux-android' >> "$GITHUB_ENV"
            echo 'TERMUX_ARCH=x86_64' >> "$GITHUB_ENV"
            ;;
          *) echo 'Unknown Android builder repository' >&2; exit 1 ;;
        esac
    - name: Validate the requested native engine identity
      if: inputs.engine_only || inputs.require_native || inputs.native_key != ''
      env:
        EXPECTED_NATIVE_KEY: ${{ inputs.native_key }}
        ENGINE_ONLY: ${{ inputs.engine_only }}
        REQUIRE_NATIVE: ${{ inputs.require_native }}
      run: |
        if [ "$ENGINE_ONLY" = true ] && [ "$REQUIRE_NATIVE" = true ]; then
          echo 'Engine production and resource-only assembly are separate phases' >&2; exit 1
        fi
        actual=$(python3 agent/packaging/browser-release.py native-key "$BROWSER_TARGET")
        if [ "$actual" != "$EXPECTED_NATIVE_KEY" ]; then
          echo 'Requested native key differs from the actual scoped compiler inputs' >&2; exit 1
        fi
    - name: Require the published Gecko component before resource assembly
      if: inputs.require_native
      run: python3 agent/packaging/browser-release.py require-engine "$BROWSER_TARGET"
    - id: component
      name: Restore a matching completed Android artifact
      env:
        GH_TOKEN: ${{ github.token }}
        TASKARIAN_FORCE_FULL_BUILD: ${{ inputs.force_rebuild && '1' || '0' }}
        ENGINE_ONLY: ${{ inputs.engine_only }}
      run: |
        arguments=()
        if [ "$ENGINE_ONLY" = true ]; then arguments+=(--force-build); fi
        python3 agent/packaging/browser-component.py restore "$BROWSER_TARGET" --directory candidate "${arguments[@]}"
    - id: geckoview-component
      name: Restore the complete unchanged GeckoView Maven module
      if: (success()) && steps.component.outputs.hit != 'true' && !inputs.force_rebuild
      run: python3 agent/packaging/android-geckoview-component.py restore "$BROWSER_TARGET" --directory "$RUNNER_TEMP/android-geckoview"
    - id: native-component
      name: Restore unchanged Android Gecko libraries
      env:
        GH_TOKEN: ${{ github.token }}
        TASKARIAN_FORCE_FULL_BUILD: ${{ inputs.force_rebuild && !inputs.require_native && '1' || '0' }}
      run: python3 agent/packaging/android-native-component.py "$BROWSER_TARGET" --directory "$RUNNER_TEMP/android-native"
      if: (success()) && steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true'
    - name: Refuse native compilation in the resource-only phase
      if: inputs.require_native && steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true'
      run: echo 'Required verified native engine could not be restored; retry its producer without compiling here' >&2; exit 1
    - name: Materialize Android application build sources
      env:
        GIT_LFS_SKIP_SMUDGE: '1'
      run: |
        python3 - <<'PYTHON'
        import json, subprocess
        from pathlib import Path
        payload = json.loads(Path('references/runtime-payload.json').read_text())
        patterns = ['/.gitignore', '/LICENSE', '/AGENTS.md', '/.github/', '/agent/', '!/agent/localai/', '!/agent/machines/vendor/',
                    '/auth/build/', '/auth/upstreams.lock.json', '/auth/dependencies/*/sources.json',
                    '/auth/dependencies/termux-lock.json', '/node/',
                    '/os/skills/', '/os/licenses/', '/os/NOTICE', '/os/packaging/', '/os/upstream/sources.json',
                    '/office/', '!/office/upstream/', '/office/upstream/*.json',
                    '/office/upstream/dependencies/*.json', '/office/upstream/dependencies/*.py',
                    '/files/', '!/files/upstream/', '/files/upstream/*.json',
                    '/references/connector/', '/references/vendor/translators/', '/references/legal/',
                    '/references/vendor/npm/', '/references/web/theme.css']
        # Mozilla's artifact build still configures mach and regenerates current
        # Gecko resources/Java from the complete pinned browser source tree.
        patterns += ['/browser/']
        patterns += ['/references/' + pattern for pattern in payload['files']]
        for item in payload['legal']:
            patterns += ['/references/' + item['source']]
            patterns += ['/references/' + path for path in item['files']]
        subprocess.run(['git', 'sparse-checkout', 'set', '--no-cone', '--stdin'],
                       input='\n'.join(patterns) + '\n', text=True, check=True)
        PYTHON
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Prepare hosted runner
      run: |
        printf '%s\n' "TASKARIAN_PUBLISHER_KEYSTORE=$RUNNER_TEMP/droid.p12" "TASKARIAN_COMPANION_LICENSES=$RUNNER_TEMP/companion-licenses.json" >> "$GITHUB_ENV"
        mkdir -p artifacts "$MOZBUILD_STATE_PATH"
        cat > "$MOZBUILD_STATE_PATH/machrc" <<'MACHRC'
        [mach_telemetry]
        is_enabled = false
        is_set_up = true
        is_employee = false
        MACHRC
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf automake libtool pkg-config python3-dev python3-venv libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdbus-glib-1-dev libdrm-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev m4 nasm unzip zip zstd imagemagick
        sudo fallocate -l 8G /mnt/taskarian.swap
        sudo chmod 600 /mnt/taskarian.swap
        sudo mkswap /mnt/taskarian.swap
        sudo swapon /mnt/taskarian.swap
      if: steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && !inputs.require_native
    - name: Prepare Android resource assembly runner
      if: steps.component.outputs.hit != 'true' && (steps.geckoview-component.outputs.hit == 'true' || steps.native-component.outputs.hit == 'true')
      run: |
        printf '%s\n' "TASKARIAN_PUBLISHER_KEYSTORE=$RUNNER_TEMP/droid.p12" "TASKARIAN_COMPANION_LICENSES=$RUNNER_TEMP/companion-licenses.json" >> "$GITHUB_ENV"
        mkdir -p artifacts "$MOZBUILD_STATE_PATH"
        cat > "$MOZBUILD_STATE_PATH/machrc" <<'MACHRC'
        [mach_telemetry]
        is_enabled = false
        is_set_up = true
        is_employee = false
        MACHRC
        sudo apt-get update
        sudo apt-get install -y python3-venv unzip zip zstd imagemagick
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: toolchain-cache
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: taskarian-android-gradle-downloads-v1-${{ runner.os }}-${{ hashFiles('browser/gradle/libs.versions.toml', 'browser/mobile/android/android-components/.config.yml', 'browser/mobile/android/*/build.gradle', 'browser/mobile/android/fenix/app/build.gradle', 'browser/python/mozboot/mozboot/android.py', 'browser/python/mozboot/mozboot/mozconfig.py') }}
        restore-keys: taskarian-android-gradle-downloads-v1-${{ runner.os }}-
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Stage the existing Droid signing identity
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: python3 browser/taskarian/android/scripts/prepare-signing.py
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Restore Gradle task outputs
      id: gradle-task-cache
      if: '!inputs.engine_only && (steps.component.outputs.hit != ''true'')'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.gradle/caches/build-cache-1
        key: android-gradle-tasks-v1-${{ env.BROWSER_TARGET }}-${{ hashFiles('browser/gradle/libs.versions.toml', 'browser/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
        restore-keys: |
          android-gradle-tasks-v1-${{ env.BROWSER_TARGET }}-${{ hashFiles('browser/gradle/libs.versions.toml', 'browser/gradle/wrapper/gradle-wrapper.properties') }}-
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
      if: steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && !inputs.require_native
    - name: Install the compatible Rust toolchain
      run: |
        version=$(python3 -c 'import json; print(json.load(open("agent/machines/rust-toolchain/sources.json"))["version"])')
        test "$RUSTUP_TOOLCHAIN" = "$version"
        rustup toolchain install "$version" --profile minimal --component rust-docs --target "$TASKARIAN_ANDROID_TARGET"
        rustup target add --toolchain "$version" wasm32-unknown-unknown
        printf '%s\n' "TASKARIAN_PHOTON_BUILD_CACHE=$RUNNER_TEMP/photon-cache" "TASKARIAN_SOURCE_CACHE=$RUNNER_TEMP/source-cache" >> "$GITHUB_ENV"
      if: steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && !inputs.require_native
    - name: Select the source archive cache for component assembly
      run: echo "TASKARIAN_SOURCE_CACHE=$RUNNER_TEMP/source-cache" >> "$GITHUB_ENV"
    - name: Select the Gecko compiler cache contract
      id: gecko-cache-contract
      if: steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && !inputs.require_native
      run: |
        digest=$(python3 agent/packaging/browser-release.py cache-contract "$BROWSER_TARGET" --output "$RUNNER_TEMP/gecko-cache-contract.json")
        printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
    - name: Restore the Gecko disk compiler cache
      id: gecko-disk-cache
      if: steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && !inputs.require_native
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: gecko-disk-v1-${{ env.BROWSER_TARGET }}-${{ steps.gecko-cache-contract.outputs.digest }}-${{ github.run_id }}
        restore-keys: |
          gecko-disk-v1-${{ env.BROWSER_TARGET }}-${{ steps.gecko-cache-contract.outputs.digest }}-
          gecko-disk-v1-${{ env.BROWSER_TARGET }}-${{ steps.gecko-cache-contract.outputs.legacy_digest }}-
    - name: Check whether the restored compiler cache contains objects
      id: gecko-disk-availability
      if: steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && !inputs.require_native
      run: python3 agent/packaging/compiler-cache.py available --directory "$SCCACHE_DIR"
    - name: Restore compiler release backup only without an Actions copy
      if: steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && steps.gecko-disk-availability.outputs.available != 'true' && !inputs.require_native
      run: python3 agent/packaging/browser-release.py restore-cache "$BROWSER_TARGET" --directory "$SCCACHE_DIR"
    - name: Bootstrap the pinned Mozilla Android toolchain
      working-directory: browser
      timeout-minutes: 30
      run: set -o pipefail; ./mach --no-interactive bootstrap --application-choice mobile_android 2>&1 | tee ../artifacts/bootstrap.log
      if: steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && !inputs.require_native
    - name: Bootstrap Mozilla Android resource assembly tools
      working-directory: browser
      timeout-minutes: 30
      run: set -o pipefail; ./mach --no-interactive bootstrap --application-choice mobile_android_artifact_mode 2>&1 | tee ../artifacts/bootstrap-artifact.log
      if: steps.component.outputs.hit != 'true' && (steps.geckoview-component.outputs.hit == 'true' || steps.native-component.outputs.hit == 'true')
    - name: Generate the product artwork
      working-directory: browser
      run: python3 taskarian/scripts/render-branding.py
      if: (success()) && steps.component.outputs.hit != 'true'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
      if: (success()) && steps.component.outputs.hit != 'true'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Build the pinned References capture extension
      run: python3 -B agent/packaging/references-component.py
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Build Gecko for the selected architecture
      working-directory: browser
      run: set -o pipefail; ./mach build 2>&1 | tee ../artifacts/gecko-build.log
      if: (success()) && steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true'
    - name: Select the reproducible Android resource build date
      if: steps.component.outputs.hit != 'true' && (steps.geckoview-component.outputs.hit == 'true' || steps.native-component.outputs.hit == 'true' || inputs.engine_only)
      run: |
        python3 - <<'PYTHON'
        from datetime import datetime, timezone
        from pathlib import Path
        import os, subprocess
        timestamp = int(subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD'], text=True))
        build_date = datetime.fromtimestamp(timestamp, timezone.utc).strftime('%Y%m%d%H%M%S')
        with Path(os.environ['GITHUB_ENV']).open('a') as output:
            output.write(f'MOZ_BUILD_DATE={build_date}\n')
        PYTHON
    - name: Regenerate current Gecko resources from the verified native engine
      working-directory: browser
      # These are the pinned upstream artifact-build TIERS in baseconfig.mk,
      # excluding android-archive-geckoview: the single Maven publication below
      # builds the required GeckoView variant without sample or test APKs.
      run: |
        set -o pipefail
        ./mach build artifact pre-export export misc libs android-stage-package tools 2>&1 | tee ../artifacts/gecko-resources.log
      if: (success()) && steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit == 'true'
    - name: Stage and verify native Gecko libraries
      working-directory: browser
      run: |
        ./mach build stage-package
        python3 ../agent/packaging/android-native-component.py "$BROWSER_TARGET" --publish --directory "$RUNNER_TEMP/android-gecko-artifact"
      if: (success()) && steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true'
      id: stage-gecko
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.native-component.outputs.artifact }}
        path: ${{ runner.temp }}/android-gecko-artifact/
        compression-level: 0
        if-no-files-found: error
      if: (success()) && steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true'
      id: engine-checkpoint
    - name: Publish only the complete GeckoView Maven module locally
      working-directory: browser
      if: (success()) && steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit == 'true'
      run: set -o pipefail; ./mach gradle :geckoview:publishDebugPublicationToMavenRepository 2>&1 | tee ../artifacts/geckoview-module.log
    - name: Capture the complete GeckoView Maven module
      id: geckoview-checkpoint
      if: (success()) && steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true'
      run: python3 agent/packaging/android-geckoview-component.py capture "$BROWSER_TARGET" --directory "$RUNNER_TEMP/android-geckoview"
    - name: Preserve the completed GeckoView module independently
      if: (success()) && steps.geckoview-checkpoint.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: taskarian-geckoview-${{ env.BROWSER_TARGET }}
        path: ${{ runner.temp }}/android-geckoview/
        compression-level: 0
        if-no-files-found: error
    - name: Release verified native object intermediates before cache backup
      if: always() && !cancelled() && steps.engine-checkpoint.outcome == 'success' && steps.geckoview-checkpoint.outcome == 'success' && steps.component.outputs.hit != 'true' && inputs.engine_only && steps.stage-gecko.outputs.license_captured == 'true'
      working-directory: browser
      run: ./mach clobber
    - name: Record native cache hits and flush the completed disk objects
      id: gecko-cache-state
      if: always() && !cancelled() && !inputs.require_native && steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && steps.gecko-cache-contract.outputs.digest != '' && env.SCCACHE_PATH != ''
      run: |
        "$SCCACHE_PATH" --show-stats --stats-format=json > "$RUNNER_TEMP/sccache-gecko.json"
        "$SCCACHE_PATH" --show-stats >> "$GITHUB_STEP_SUMMARY"
        if ! "$SCCACHE_PATH" --stop-server 2> "$RUNNER_TEMP/sccache-stop.log"; then
          cat "$RUNNER_TEMP/sccache-stop.log" >&2
          if ! grep -q "couldn't connect to server" "$RUNNER_TEMP/sccache-stop.log"; then exit 1; fi
        fi
        python3 agent/packaging/compiler-cache.py available --directory "$SCCACHE_DIR"
    - name: Save the Gecko disk compiler cache
      if: always() && !cancelled() && steps.gecko-cache-state.outputs.available == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: gecko-disk-v1-${{ env.BROWSER_TARGET }}-${{ steps.gecko-cache-contract.outputs.digest }}-${{ github.run_id }}
      continue-on-error: true
    - name: Keep the completed compiler objects as a release fallback
      if: always() && !cancelled() && steps.gecko-cache-state.outputs.available == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 agent/packaging/compiler-cache.py save sccache "$BROWSER_TARGET" --contract "$RUNNER_TEMP/gecko-cache-contract.json" --directory "$SCCACHE_DIR"
    - name: Upload actual Gecko compiler cache statistics
      if: always() && !cancelled() && !inputs.require_native && steps.component.outputs.hit != 'true' && steps.geckoview-component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && steps.gecko-cache-contract.outputs.digest != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gecko-compiler-cache-statistics
        path: ${{ runner.temp }}/sccache-gecko.json
        if-no-files-found: ignore
    - name: Publish the verified native Gecko component
      if: always() && !cancelled() && steps.engine-checkpoint.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 agent/packaging/browser-release.py publish-engine "$BROWSER_TARGET" --directory "$RUNNER_TEMP/android-gecko-artifact"
      id: publish-engine
    - name: Publish the complete GeckoView component independently
      id: publish-geckoview
      if: always() && !cancelled() && steps.publish-engine.outcome == 'success' && steps.geckoview-checkpoint.outcome == 'success'
      run: python3 agent/packaging/android-geckoview-component.py publish "$BROWSER_TARGET" --directory "$RUNNER_TEMP/android-geckoview"
    - name: Configure application assembly with the complete prebuilt GeckoView module
      if: (success()) && steps.component.outputs.hit != 'true' && (steps.geckoview-component.outputs.hit == 'true' || inputs.engine_only)
      working-directory: browser
      run: |
        export MOZCONFIG="$RUNNER_TEMP/android-geckoview/mozconfig"
        printf 'MOZCONFIG=%s\n' "$MOZCONFIG" >> "$GITHUB_ENV"
        ./mach configure
        ./mach build buildid.h
        python3 ../agent/packaging/android-geckoview-component.py stage "$BROWSER_TARGET" --directory "$RUNNER_TEMP/android-geckoview"
    - name: Restore exact app-native dependencies and actual companion licenses
      if: '!inputs.engine_only && (steps.component.outputs.hit != ''true'')'
      run: |
        python3 agent/packaging/android-components.py restore android-remote "termux-$TERMUX_ARCH" --wait --directory "$RUNNER_TEMP/android-leaves/remote"
        python3 agent/packaging/android-components.py restore android-tor "termux-$TERMUX_ARCH" --wait --directory "$RUNNER_TEMP/android-leaves/tor"
        python3 agent/packaging/android-components.py restore android-x11 "termux-$TERMUX_ARCH" --wait --directory "$RUNNER_TEMP/android-leaves/x11"
        printf '%s\n' "TASKARIAN_REMOTE_CLIENT_DIR=$RUNNER_TEMP/android-leaves/remote" "TASKARIAN_TOR_ANDROID_DIR=$RUNNER_TEMP/android-leaves/tor" "TASKARIAN_DISPLAY_ANDROID_DIR=$RUNNER_TEMP/android-leaves/x11" >> "$GITHUB_ENV"
        python3 agent/packaging/browser-release.py android-companion "$BROWSER_TARGET" --directory "$RUNNER_TEMP/android-companion"
    - name: Reuse exact Android dependency sources by permanent reference
      if: '!inputs.engine_only && (steps.component.outputs.hit != ''true'')'
      run: python3 agent/packaging/browser-release.py android-sources "$BROWSER_TARGET" --directory "$RUNNER_TEMP/android-leaves/library-source"
    - name: Verify release assembly uses the complete GeckoView prebuilt
      if: (success()) && steps.component.outputs.hit != 'true'
      working-directory: browser
      run: |
        set -o pipefail
        ./mach gradle :fenix:assembleRelease --dry-run 2>&1 | tee ../artifacts/geckoview-consumer-plan.log
        python3 ../agent/packaging/android-geckoview-component.py check-plan "$BROWSER_TARGET" --plan ../artifacts/geckoview-consumer-plan.log
    - name: Verify the prebuilt module's native source and license integration
      if: (success()) && inputs.engine_only && steps.component.outputs.hit != 'true'
      working-directory: browser
      run: |
        set -o pipefail
        ./mach gradle :fenix:releaseOssLicensesTask :fenix:stageTaskarianDependencySources --dry-run 2>&1 | tee ../artifacts/geckoview-legal-plan.log
        python3 ../agent/packaging/android-geckoview-component.py check-plan "$BROWSER_TARGET" --plan ../artifacts/geckoview-legal-plan.log --metadata-only
        ./mach gradle :fenix:releaseOssLicensesTask :fenix:stageTaskarianDependencySources 2>&1 | tee ../artifacts/geckoview-legal-build.log
    - name: Assemble the release browser
      working-directory: browser
      run: set -o pipefail; ./mach gradle :fenix:assembleRelease --profile 2>&1 | tee ../artifacts/apk-build.log
      if: '!inputs.engine_only && ((success()) && steps.component.outputs.hit != ''true'')'
    - name: Sign, verify and collect the production APK
      run: python3 browser/taskarian/android/scripts/collect-artifacts.py candidate
      if: '!inputs.engine_only && ((success()) && steps.component.outputs.hit != ''true'')'
    - name: Verify the Android artifact and source inputs
      run: python3 agent/packaging/browser-component.py verify "$BROWSER_TARGET" --directory candidate
      if: '!inputs.engine_only'
    - name: Publish the current APK resources independently
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 agent/packaging/browser-release.py publish-resources "$BROWSER_TARGET" --directory candidate
      if: '!inputs.engine_only && steps.component.outputs.hit != ''true'''
    - name: Publish the complete application independently
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 agent/packaging/browser-release.py dependencies "$BROWSER_TARGET" --directory "$RUNNER_TEMP/android-leaves" --output "$RUNNER_TEMP/browser-dependencies.json"
        python3 agent/packaging/application.py publish "$BROWSER_TARGET" --directory candidate --dependencies "$RUNNER_TEMP/browser-dependencies.json"
      if: '!inputs.engine_only && steps.component.outputs.application_hit != ''true'''
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.component.outputs.artifact }}
        path: candidate/
        compression-level: 0
        if-no-files-found: error
      if: '!inputs.engine_only'
    - name: Save Gradle dependency downloads
      if: (always() && !cancelled() && steps.toolchain-cache.outputs.cache-hit != 'true') && steps.component.outputs.hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: taskarian-android-gradle-downloads-v1-${{ runner.os }}-${{ hashFiles('browser/gradle/libs.versions.toml', 'browser/mobile/android/android-components/.config.yml', 'browser/mobile/android/*/build.gradle', 'browser/mobile/android/fenix/app/build.gradle', 'browser/python/mozboot/mozboot/android.py', 'browser/python/mozboot/mozboot/mozconfig.py') }}
    - name: Save completed Gradle task outputs
      if: '!inputs.engine_only && (always() && !cancelled() && steps.component.outputs.hit != ''true'')'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.gradle/caches/build-cache-1
        key: android-gradle-tasks-v1-${{ env.BROWSER_TARGET }}-${{ hashFiles('browser/gradle/libs.versions.toml', 'browser/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
    - name: Upload Gradle timing report
      if: always() && steps.component.outputs.hit != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: android-gradle-timing
        path: ${{ github.workspace }}-obj-android/gradle/build/reports/profile/
        if-no-files-found: ignore
    - name: Remove staged signing key
      if: (always()) && steps.component.outputs.hit != 'true'
      run: rm -f "$TASKARIAN_PUBLISHER_KEYSTORE"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: android-build-logs
        path: |
          artifacts/
          ${{ runner.temp }}/tor-build/**/build.log
        if-no-files-found: ignore
